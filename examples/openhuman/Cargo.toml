[package]
name = "tinyhivemind-openhuman-example"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "tinyhivemind-openhuman-example"

# This is deliberately a standalone crate rather than a workspace member.
# Its live binaries and independent lockfile keep experiment-only dependencies
# out of normal workspace builds while exercising the OpenHuman library adapter.
[workspace]

[dependencies]
anyhow = "1"
# The multi-hive host supplies one classified native filesystem proof tool.
async-trait = "0.1"
tinytools = { git = "https://github.com/tinyhumansai/tinytools", rev = "3a01641f8ebd8a55656cd212f9a90638d958a447" }
futures = "0.3"
# The live hive uses OpenHuman's native runtime, agents, sessions, and TinyCortex module.
openhuman-embed = { path = "../../vendor/openhuman/crates/openhuman-embed", default-features = false, features = ["mcp", "modules", "skills"] }
# Core configuration and sandbox types used by the standalone host examples.
openhuman = { path = "../../vendor/openhuman/crates/openhuman-core", default-features = false }
# Public research sources are mirrored into the isolated run workspace before turns start.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tinyhivemind-core = { path = "../../crates/tinyhivemind-core" }
tinyhivemind-hives = { path = "../../crates/tinyhivemind-hives" }
# The Euler hive host loads a hive-language package from disk and lowers it.
tinyhivemind-lang = { path = "../../crates/tinyhivemind-lang" }
# The Euler hive's research seats search through the TinyHumans backend's
# agent integrations (Exa search, Gemini with Google Search grounding).
tinyhumans-sdk = { path = "../../vendor/openhuman/vendor/tinyhumans-sdk", default-features = false }
# CortexDB behind the TinyHumans backend: the Euler hive's durable seat memory.
tinymemory-integrations = { path = "../../vendor/openhuman/vendor/tinymemory/crates/tinymemory-integrations", default-features = false, features = ["cortex"] }
# Supplied-agent integration; runtime construction stays in this example.
tinyhivemind-openhuman = { path = "../../crates/tinyhivemind-openhuman", features = ["offline"] }
# Pure core tool bookkeeping used by the research experiments.
tinyhivemind-tools = { path = "../../crates/tinyhivemind-tools" }
# The DeepSWE opt-in resolves the same durable engine for hive recall and OpenHuman.
tinymemory-api = { git = "https://github.com/tinyhumansai/tinymemory", rev = "6018a91a773555efb50bf1959a6621292618e04a" }
# Diagnostic only: OpenHuman sanitises a hosted-agent failure into a fixed
# string, so the underlying reason is only visible through its own logging.
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tempfile = "3"
# The inspector must terminate a hung Docker CLI from the host side.
wait-timeout = "0.2"
wiremock = "0.6"

[dev-dependencies]
tinymemory-api = { git = "https://github.com/tinyhumansai/tinymemory", rev = "6018a91a773555efb50bf1959a6621292618e04a", features = ["conformance"] }

# `tinyhivemind-openhuman` above is a member of the root workspace and inherits
# its harness dependencies from there, which name git sources (see the root
# `Cargo.toml` comment). `field.workspace = true` only copies the dependency
# *spec* across the workspace boundary; it does not carry the root workspace's
# own `[patch]` tables with it. Without the same patches here, this standalone
# workspace would fetch OpenHuman and the tool crates fresh from git instead of
# reusing the vendored submodule the `openhuman`/`openhuman-embed` path
# dependencies above already point at — two copies of OpenHuman's
# process-wide state in one binary. Keep this in sync with the root `[patch]`.
# A host that vendors this repository writes these same lines against its own
# tree.
[patch."https://github.com/tinyhumansai/openhuman"]
openhuman-embed = { path = "../../vendor/openhuman/crates/openhuman-embed" }
openhuman = { path = "../../vendor/openhuman/crates/openhuman-core" }

[patch."https://github.com/tinyhumansai/tinytools"]
# tinymcp's `tools` feature names tinytools by git rev so it can be built on its
# own. Redirect it to the copy tinyagents vendors — the one the harness and
# every host tool link — so there is exactly one `tinytools` package and one
# `Tool` trait. Without this, MCP tools would not satisfy the harness's trait.
tinytools = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinytools/crates/tinytools" }
tinytools-std = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinytools/crates/tinytools-std" }
tinytools-agent = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinytools/crates/tinytools-agent" }

[patch."https://github.com/tinyhumansai/tinymemory"]
tinymemory-api = { path = "../../vendor/openhuman/vendor/tinymemory/crates/tinymemory-api" }
tinymemory-tools = { path = "../../vendor/openhuman/vendor/tinymemory/crates/tinymemory-tools" }
tinymemory-integrations = { path = "../../vendor/openhuman/vendor/tinymemory/crates/tinymemory-integrations" }

[patch."https://github.com/tinyhumansai/tinybus"]
# tinystoragedrivers-bus (and tinywallet, which names tinybus by git rev) name
# tinybus by git. Redirect them to the in-tree copy so the graph holds exactly
# one `tinybus` (one `Interface`, one `Connection`) and one module SDK instead of
# a second set compiled only for the storage wire types.
tinybus = { path = "../../vendor/openhuman/vendor/tinybus/crates/tinybus" }
tinybus-macros = { path = "../../vendor/openhuman/vendor/tinybus/crates/tinybus-macros" }
tinybus-module = { path = "../../vendor/openhuman/vendor/tinybus/crates/tinybus-module" }

[patch."https://github.com/senamakel/tinybus"]
# The v2 storage and TinyBox modules depend on the migration fork URL. Patch
# that source identity to the same checkout as the canonical dependency above
# so all bus interfaces share one Rust type identity.
tinybus = { path = "../../vendor/openhuman/vendor/tinybus/crates/tinybus" }
tinybus-macros = { path = "../../vendor/openhuman/vendor/tinybus/crates/tinybus-macros" }
tinybus-module = { path = "../../vendor/openhuman/vendor/tinybus/crates/tinybus-module" }

[patch."https://github.com/tinyhumansai/tinystoragedrivers"]
# One editable checkout every module resolves onto. The v2 repository splits
# the public facade, API, types and primitive implementations into separate
# packages; only packages that exist in the pinned v2 checkout are patched.
# scripts/ci/check-storage-owner.mjs enforces that resolved TSD packages stay
# under this vendor directory.
tinystoragedrivers = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers" }
tinystoragedrivers-api = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-api" }
tinystoragedrivers-blob = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-blob" }
tinystoragedrivers-bus = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-bus" }
tinystoragedrivers-busproxy = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-busproxy" }
tinystoragedrivers-connect = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-connect" }
tinystoragedrivers-document = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-document" }
tinystoragedrivers-kv = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-kv" }
tinystoragedrivers-queue = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-queue" }
tinystoragedrivers-secrets = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-secrets" }
tinystoragedrivers-testkit = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-testkit" }
tinystoragedrivers-types = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-types" }

[patch."https://github.com/senamakel/tinystoragedrivers"]
# The v2.1.0 owner APIs are published from the migration fork while the host
# consumes their canonical module sources from the same pinned vendor tree.
tinystoragedrivers = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers" }
tinystoragedrivers-api = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-api" }
tinystoragedrivers-blob = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-blob" }
tinystoragedrivers-bus = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-bus" }
tinystoragedrivers-busproxy = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-busproxy" }
tinystoragedrivers-connect = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-connect" }
tinystoragedrivers-document = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-document" }
tinystoragedrivers-kv = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-kv" }
tinystoragedrivers-queue = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-queue" }
tinystoragedrivers-secrets = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-secrets" }
tinystoragedrivers-testkit = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-testkit" }
tinystoragedrivers-types = { path = "../../vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-types" }

[patch."https://github.com/tinyhumansai/tinyinference"]
# tinymemes depends on the Jev client by git; resolve it to the vendored copy.
tinyinference-decisions = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-decisions" }
tinyinference-core = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-core" }
tinyinference-embeddings = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-embeddings" }
tinyinference-llm = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-llm" }
tinyinference-local = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-local" }
tinyinference-providers = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-providers" }
tinyinference-voice = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-voice" }

[patch.crates-io]
# Module crates name TinyAgents by version (with a nested-path patch of their
# own for standalone builds); resolve those names to the one copy the host uses.
tinyagents-live = { path = "../../vendor/openhuman/vendor/tinyagents/crates/tinyagents-live" }
tinyagents-harness = { path = "../../vendor/openhuman/vendor/tinyagents/crates/tinyagents-harness" }
tinyagents-hooks = { path = "../../vendor/openhuman/vendor/tinyagents/crates/tinyagents-hooks" }
tinytools = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinytools/crates/tinytools" }
tinybus = { path = "../../vendor/openhuman/vendor/tinybus/crates/tinybus" }
tinybus-macros = { path = "../../vendor/openhuman/vendor/tinybus/crates/tinybus-macros" }
tinybus-module = { path = "../../vendor/openhuman/vendor/tinybus/crates/tinybus-module" }
tinyinference-core = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-core" }
tinyinference-embeddings = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-embeddings" }
tinyinference-llm = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-llm" }
tinyinference-local = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-local" }
tinyinference-providers = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-providers" }
tinyinference-voice = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-voice" }
tinyflows = { path = "../../vendor/openhuman/vendor/tinyflows/crates/tinyflows" }
tinychannels = { path = "../../vendor/openhuman/vendor/tinychannels" }
tiny-artifacts = { path = "../../vendor/openhuman/vendor/tiny-artifacts/crates/tiny-artifacts" }
