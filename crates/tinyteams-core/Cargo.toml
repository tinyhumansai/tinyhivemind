[package]
name = "tinyteams-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Desks, rosters, mentions and shared session transcripts for agent group chats: the pure algebra, with no transport and no IO."
documentation = "https://docs.rs/tinyteams-core"
readme = "../../README.md"
keywords = ["agents", "chat", "mentions", "roster", "transcript"]
categories = ["development-tools"]
publish = false

# Deliberately dependency-light. This crate is linked into the hot path of
# every agent turn — addressing a message, resolving a mention, projecting a
# transcript — so it must cost a host almost nothing, and it must compile in a
# host's default build with no feature flags. Nothing here may pull in an async
# runtime, an HTTP client, a web framework, or a native library.
# `.github/scripts/assert-pure.sh` asserts it.
#
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Unit tests and the opt-in OpenRouter harness both exercise JSON wire forms.
serde_json = { workspace = true }

[features]
default = []
# Compiles opt-in tests that can call external model providers. Live execution
# still requires the explicit environment switch documented in docs/testing.md.
e2e = []

[lints]
workspace = true
