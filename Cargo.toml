[workspace]
resolver = "3"
# Every crate in this repository lives under `crates/`, one directory per
# package, each directory named for the package it holds. There is no root
# package: the crate a host links is `crates/tinyhivemind-core`, the same as any
# other member. Keeping the root virtual is what makes that uniform.
members = ["crates/tinyhivemind-core", "crates/tinyhivemind-tools", "crates/tinyhivemind-openhuman", "crates/tinyhivemind-hives", "crates/tinyhivemind-lang", "crates/tinyhivemind-exec"]
# `worktrees/` holds `git worktree` checkouts of this same repository; each
# contains a full copy of this manifest. Keep them excluded from Cargo
# workspace discovery.
exclude = ["vendor", "worktrees"]

# Shared package metadata. A member inherits a field with `field.workspace =
# true`, so the version is written in exactly one place and every crate moves
# together. There is no release workflow and nothing here is published: a
# consumer pins a git commit, and that commit is the version.
[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinyhivemind"

[workspace.dependencies]
# Declarative host-neutral hive packages and edit validation.
tinyhivemind-lang = { path = "crates/tinyhivemind-lang" }
# Runs the executable tools and hooks a hive package declares, as child
# processes under the calling convention in `docs/specs/executable-tools.md`.
tinyhivemind-exec = { path = "crates/tinyhivemind-exec" }
# Cryptographic identities for evaluated hive package lineage.
sha2 = "0.10"
# Durable cross-hive coordinator used at the harness boundary.
tinyhivemind-hives = { path = "crates/tinyhivemind-hives" }
# Concurrent owned runner futures in the coordinator, outside core.
futures = "0.3"
# Optional coordinator SQLite snapshots; matches the harness SQLite dependency.
rusqlite = { version = "0.40", features = ["bundled"] }
# Host-neutral grammar, session ports, routing, hive folds, and driver.
tinyhivemind-core = { path = "crates/tinyhivemind-core" }
# Native tool specifications and the episode call record.
tinyhivemind-tools = { path = "crates/tinyhivemind-tools" }
# The harness, for `tinyhivemind-openhuman` and nothing else under `crates/*`.
# `openhuman-embed` provides the supplied Agent handle and attachment API;
# `openhuman` provides usage types. `tinytools` defines the native Tool trait;
# `tinytools-agent` shares OpenHuman's tool dialect. Default features
# off: the adapter names the one feature it needs, and the consuming host
# chooses the rest.
#
# Git dependencies on purpose, not the vendored path. A host that vendors this
# repository as a submodule (OpenCompany) carries its own `vendor/openhuman`
# and must link ONE copy of OpenHuman: the `Agent` in a binding here has to
# be the same type the host built, the native `Tool` it takes has to be
# the `Tool` this repository implements, and OpenHuman's process-wide state
# must exist once. Cargo `[patch]` can redirect a git or registry source onto
# a path but cannot redirect a path source, so a path here would leave a host
# no way to unify the two trees. The `[patch]` tables below point these same
# sources at the vendored checkout for this repository's own build, and a
# host writes the same four lines against its own. `tinytools` is pinned at
# the commit OpenHuman's own tree vendors, which is what makes the unification
# exact; `.github/scripts/assert-openhuman-pin.sh` checks all three revs.
openhuman-embed = { git = "https://github.com/tinyhumansai/openhuman", rev = "5f8b7c235f18b46f90fabbf1e7f1b8d9a957cee6", default-features = false }
openhuman = { git = "https://github.com/tinyhumansai/openhuman", rev = "5f8b7c235f18b46f90fabbf1e7f1b8d9a957cee6", default-features = false }
tinytools = { git = "https://github.com/tinyhumansai/tinytools", rev = "75e42ba9647eb801891a12ad05b6337f6a1c126b" }
tinytools-agent = { git = "https://github.com/tinyhumansai/tinytools", rev = "75e42ba9647eb801891a12ad05b6337f6a1c126b" }
# The memory engine contract and the per-agent lifecycle OpenHuman runs its
# seats' memory through, for the adapter's `Recall`/`Remember` over the same
# engine and layout. Git sources pinned at the commit OpenHuman's tree vendors
# and patched onto that copy below, for the same one-copy reason as the tool
# crates; `.github/scripts/assert-openhuman-pin.sh` checks the rev.
tinymemory-api = { git = "https://github.com/tinyhumansai/tinymemory", rev = "8b919fd6d0b99e06269cab84de0c715772d0c49f" }
tinymemory-tools = { git = "https://github.com/tinyhumansai/tinymemory", rev = "8b919fd6d0b99e06269cab84de0c715772d0c49f" }
# OpenHuman's cron schedule validator, which moved out of `openhuman::cron`
# into the tinyflows scheduler crate. Git source pinned at the commit
# OpenHuman's tree vendors and patched onto that copy below, so its
# `Schedule` is the same type `openhuman::cron` re-exports.
tinyflows-schedule = { git = "https://github.com/tinyhumansai/tinyflows", rev = "99fd391d43a9af943535cda5579f1e2246bafbdc" }
# Derive macros for the crate-wide error type in `crates/tinyhivemind-core/src/error/`.
# Every dependency entry should carry a comment like this one saying why it is
# here.
thiserror = "2"
# Desk overlays, mentions and session messages cross a wire: they are stored
# inside the host's own records and its append-only journal. Their serde
# attributes are part of that wire format and travel with the type definitions.
serde = { version = "1", features = ["derive"] }
# Pins the exact JSON object shape and required fields of host-facing DTOs in
# unit tests without adding JSON handling to the runtime dependency graph.
serde_json = "1"
# Fixed-time validation through OpenHuman's native cron schedule parser.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Drives coordinator scheduling, adapter turn deadlines/progress, and async
# tests. Pure core remains executor-neutral and exposes boxed host futures.
tokio = { version = "1", features = ["macros", "rt", "sync"] }
# Implements async native `tinytools::Tool` methods in the OpenHuman adapter.
async-trait = "0.1"
# `tinytools::Tool::execute` returns `anyhow::Result`, so implementing it
# means naming the type, and every OpenHuman entry point returns it too. It
# is forbidden in every crate `assert-pure.sh` guards and reaches only the
# crates that implement that trait: `tinyhivemind-openhuman`, the one crate
# that links the harness, and `tinyhivemind-exec`, whose program tools it
# attaches.
anyhow = "1"
# The adapter's scripted model and backend stub, behind its `offline`
# feature, and its own tests.
wiremock = "0.6"
# Temporary workspaces for adapter tests.
tempfile = "3"
# EXAMPLE-ONLY. The benchmark's Jev arm uses the native System One client;
# library crates keep only provider-neutral fixed-point decision snapshots.
tinyjevclient = { path = "vendor/tinyjevclient/crates/tinyjevclient", default-features = false }


# Lints apply to every member that opts in with `[lints] workspace = true`, and
# to every target of that member. CI runs clippy with `-D warnings`, so anything
# set to "warn" here fails the build in CI.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Resolve the git `openhuman-embed` above onto the vendored submodule so this
# workspace builds against exactly the tree it records (and CI, which checks
# out submodules recursively, needs no network for it). The `rev` above and
# the submodule pointer must agree; `.github/scripts/assert-openhuman-pin.sh`
# fails the build when they drift.
[patch."https://github.com/tinyhumansai/openhuman"]
openhuman-embed = { path = "vendor/openhuman/crates/openhuman-embed" }
openhuman = { path = "vendor/openhuman/crates/openhuman-core" }

# The same, for the tool crates: onto the copy inside the vendored OpenHuman,
# the one OpenHuman itself resolves them from, so a raw session's `Tool` is
# this repository's `Tool`.
[patch."https://github.com/tinyhumansai/tinytools"]
# tinymcp's `tools` feature names tinytools by git rev so it can be built on its
# own. Redirect it to the copy tinyagents vendors — the one the harness and
# every host tool link — so there is exactly one `tinytools` package and one
# `Tool` trait. Without this, MCP tools would not satisfy the harness's trait.
tinytools = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinytools/crates/tinytools" }
tinytools-std = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinytools/crates/tinytools-std" }
tinytools-agent = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinytools/crates/tinytools-agent" }

# Keep the memory packages on the OpenHuman submodule copy. OpenHuman's
# workspace patches do not apply when this repository is the Cargo workspace
# root, so the tables below mirror `vendor/openhuman/Cargo.toml`'s own
# `[patch]` section with every path re-rooted under `vendor/openhuman/`. Keep
# them in sync when the pin moves: a source left unpatched here resolves to a
# second copy of the crate and splits a type OpenHuman shares with the adapter.
[patch."https://github.com/tinyhumansai/tinymemory"]
tinymemory-api = { path = "vendor/openhuman/vendor/tinymemory/crates/tinymemory-api" }
tinymemory-tools = { path = "vendor/openhuman/vendor/tinymemory/crates/tinymemory-tools" }
tinymemory-integrations = { path = "vendor/openhuman/vendor/tinymemory/crates/tinymemory-integrations" }

[patch."https://github.com/tinyhumansai/tinyflows"]
tinyflows-schedule = { path = "vendor/openhuman/vendor/tinyflows/crates/tinyflows-schedule" }

[patch."https://github.com/tinyhumansai/tinybus"]
# tinystoragedrivers-bus (and tinywallet, which names tinybus by git rev) name
# tinybus by git. Redirect them to the in-tree copy so the graph holds exactly
# one `tinybus` (one `Interface`, one `Connection`) and one module SDK instead of
# a second set compiled only for the storage wire types.
tinybus = { path = "vendor/openhuman/vendor/tinybus/crates/tinybus" }
tinybus-macros = { path = "vendor/openhuman/vendor/tinybus/crates/tinybus-macros" }
tinybus-module = { path = "vendor/openhuman/vendor/tinybus/crates/tinybus-module" }

[patch."https://github.com/senamakel/tinybus"]
# The v2 storage and TinyBox modules depend on the migration fork URL. Patch
# that source identity to the same checkout as the canonical dependency above
# so all bus interfaces share one Rust type identity.
tinybus = { path = "vendor/openhuman/vendor/tinybus/crates/tinybus" }
tinybus-macros = { path = "vendor/openhuman/vendor/tinybus/crates/tinybus-macros" }
tinybus-module = { path = "vendor/openhuman/vendor/tinybus/crates/tinybus-module" }

[patch."https://github.com/tinyhumansai/tinystoragedrivers"]
# One editable checkout every module resolves onto. The v2 repository splits
# the public facade, API, types and primitive implementations into separate
# packages; only packages that exist in the pinned v2 checkout are patched.
# scripts/ci/check-storage-owner.mjs enforces that resolved TSD packages stay
# under this vendor directory.
tinystoragedrivers = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers" }
tinystoragedrivers-api = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-api" }
tinystoragedrivers-blob = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-blob" }
tinystoragedrivers-bus = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-bus" }
tinystoragedrivers-busproxy = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-busproxy" }
tinystoragedrivers-connect = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-connect" }
tinystoragedrivers-document = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-document" }
tinystoragedrivers-kv = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-kv" }
tinystoragedrivers-queue = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-queue" }
tinystoragedrivers-secrets = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-secrets" }
tinystoragedrivers-testkit = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-testkit" }
tinystoragedrivers-types = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-types" }

[patch."https://github.com/senamakel/tinystoragedrivers"]
# The v2.1.0 owner APIs are published from the migration fork while the host
# consumes their canonical module sources from the same pinned vendor tree.
tinystoragedrivers = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers" }
tinystoragedrivers-api = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-api" }
tinystoragedrivers-blob = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-blob" }
tinystoragedrivers-bus = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-bus" }
tinystoragedrivers-busproxy = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-busproxy" }
tinystoragedrivers-connect = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-connect" }
tinystoragedrivers-document = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-document" }
tinystoragedrivers-kv = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-kv" }
tinystoragedrivers-queue = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-queue" }
tinystoragedrivers-secrets = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-secrets" }
tinystoragedrivers-testkit = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-testkit" }
tinystoragedrivers-types = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-types" }

[patch."https://github.com/tinyhumansai/tinyinference"]
# tinymemes depends on the Jev client by git; resolve it to the vendored copy.
tinyinference-decisions = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-decisions" }
tinyinference-core = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-core" }
tinyinference-embeddings = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-embeddings" }
tinyinference-llm = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-llm" }
tinyinference-local = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-local" }
tinyinference-providers = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-providers" }
tinyinference-voice = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-voice" }

[patch.crates-io]
# Module crates name TinyAgents by version (with a nested-path patch of their
# own for standalone builds); resolve those names to the one copy the host uses.
tinyagents-live = { path = "vendor/openhuman/vendor/tinyagents/crates/tinyagents-live" }
tinyagents-harness = { path = "vendor/openhuman/vendor/tinyagents/crates/tinyagents-harness" }
tinyagents-hooks = { path = "vendor/openhuman/vendor/tinyagents/crates/tinyagents-hooks" }
tinytools = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinytools/crates/tinytools" }
tinybus = { path = "vendor/openhuman/vendor/tinybus/crates/tinybus" }
tinybus-macros = { path = "vendor/openhuman/vendor/tinybus/crates/tinybus-macros" }
tinybus-module = { path = "vendor/openhuman/vendor/tinybus/crates/tinybus-module" }
tinyinference-core = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-core" }
tinyinference-embeddings = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-embeddings" }
tinyinference-llm = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-llm" }
tinyinference-local = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-local" }
tinyinference-providers = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-providers" }
tinyinference-voice = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-voice" }
tinyflows = { path = "vendor/openhuman/vendor/tinyflows/crates/tinyflows" }
tinychannels = { path = "vendor/openhuman/vendor/tinychannels" }
tiny-artifacts = { path = "vendor/openhuman/vendor/tiny-artifacts/crates/tiny-artifacts" }
